services:
  argos:
    build: .
    image: argos-bot:latest
    container_name: argos
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - argos-data:/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/argos", "healthcheck"]
      interval: 1m
      timeout: 10s
      start_period: 1m
    restart: unless-stopped

  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: argos-sqlite-web
    profiles: [db-web]
    depends_on: [argos]
    command: ["argos.db", "--password", "--foreign-keys", "--no-browser"]
    environment:
      - SQLITE_WEB_PASSWORD=${SQLITE_WEB_PASSWORD:-}
    user: "65532:65532"
    volumes:
      - argos-data:/data
    ports:
      - "${SQLITE_WEB_ADDR:-127.0.0.1}:${SQLITE_WEB_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  argos-data:
    name: argos-data
