services:
  argos:
    build: .
    image: pedrodl/argos-bot:latest
    container_name: argos
    env_file: .env
    volumes:
      - argos-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: argos-sqlite-web
    profiles: [db-web]
    depends_on: [argos]
    command: ["argos.db", "--password", "--foreign-keys", "--no-browser"]
    environment:
      - SQLITE_WEB_PASSWORD=${SQLITE_WEB_PASSWORD:-}
    user: "65532:65532"
    volumes:
      - argos-data:/data
    ports:
      - "${SQLITE_WEB_ADDR:-127.0.0.1}:${SQLITE_WEB_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  sqlite:
    build: &sqlite-image
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache sqlite
    image: argos-sqlite:latest
    profiles: [tools]
    user: "65532:65532"
    environment:
      - HOME=/tmp
    volumes:
      - argos-data:/data
    read_only: true
    tmpfs:
      - /tmp

  sqlite-ro:
    build: *sqlite-image
    image: argos-sqlite:latest
    container_name: argos-sqlite-ro
    profiles: [db-ro]
    depends_on: [argos]
    command: ["sleep", "infinity"]
    init: true
    user: "65532:65532"
    environment:
      - HOME=/tmp
    volumes:
      - argos-data:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  argos-data:
    name: argos-data
